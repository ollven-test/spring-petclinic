name: Nightly

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Full lifecycle in one go: all 79 tests (unit + integration) plus the
  # validate-phase gates, jacoco report, SBOM, jar and repackage.
  verify:
    name: Full verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify
        run: ./mvnw -B verify

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
