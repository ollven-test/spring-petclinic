name: Release

# Reusable workflow: creates a GitHub release for the caller's commit.
# The tag is the latest release's tag with the patch number bumped
# (v1.2.9 -> v1.2.10), or v0.1.0 when the repo has no releases yet.
# Skips without failing when the latest release already points at the commit.
#
# Usage from another workflow. The caller must grant contents: write,
# because a called workflow cannot raise the caller's token permissions.
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: ./.github/workflows/release.yml

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          LAST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release found; creating the first one."
            NEXT_TAG="v0.1.0"
          else
            LAST_SHA=$(git rev-list -n 1 "$LAST_TAG")
            if [ "$LAST_SHA" = "$HEAD_SHA" ]; then
              echo "No changes since $LAST_TAG ($LAST_SHA); skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "$LAST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest release tag '$LAST_TAG' is not in vMAJOR.MINOR.PATCH format; cannot compute next version."
              exit 1
            fi
            NEXT_TAG="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            echo "Changes found since $LAST_TAG; next release will be $NEXT_TAG."
          fi

          {
            echo "skip=false"
            echo "last_tag=$LAST_TAG"
            echo "next_tag=$NEXT_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
          NEXT_TAG: ${{ steps.check.outputs.next_tag }}
        run: |
          set -euo pipefail
          gh release create "$NEXT_TAG" \
            --target "$GITHUB_SHA" \
            --title "$NEXT_TAG" \
            --generate-notes \
            ${LAST_TAG:+--notes-start-tag "$LAST_TAG"}
